[env:esp32s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/generate_firmware_version.py
    post:scripts/export_firmware.py

board_build.flash_mode = dio
board_build.psram = disabled
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv

build_flags =
    -Iinclude
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D USE_ESP_IDF_LOG
    -D TAG='"ARDUINO"'
    -D ENABLE_TANK
    -D FIRMWARE_REPO_OWNER='"justmoen"'
    -D FIRMWARE_REPO_NAME='"Ultrasonic-Liquid-Level-Sensor-SenseEsp-A02YYUW"'

lib_deps = 
    elvandry13/UltrasonicA02YYUW@^1.0.0
    SignalK/SensESP@^3.0.0
    electroniccats/MPU6050@^1.0.0

[env:esp32doit]
platform = espressif32@6.5.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/generate_firmware_version.py
    post:scripts/export_firmware.py

; Flash settings (safe defaults for DOIT)
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.flash_size = 4MB

; No PSRAM on this board
board_build.psram = disabled

; Partition (optional but safe)
board_build.partitions = min_spiffs.csv

build_flags =
    -Iinclude
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    -D USE_ESP_IDF_LOG
    -D TAG='"ARDUINO"'
    -D ENABLE_MPPT
    -D FIRMWARE_REPO_OWNER='"justmoen"'
    -D FIRMWARE_REPO_NAME='"Ultrasonic-Liquid-Level-Sensor-SenseEsp-A02YYUW"'

lib_deps = 
    elvandry13/UltrasonicA02YYUW@^1.0.0
    SignalK/SensESP@^3.0.0
    electroniccats/MPU6050@^1.0.0